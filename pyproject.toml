[project]
name = "heartbeat-monitor"
version = "1.5.1"
description = "A simple client-server heartbeat monitoring tool for system analytics."
license.file = "LICENSE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psutil>=7.1.2", "pydantic>=2.12.3"]

[dependency-groups]
dev = [
    "pyrefly",
    "ruff",
    "types-psutil>=7.2.2.20260906",
    "vermin>=1.7.0",
]

[tool.ruff.lint]
select = [
    # Core & Style
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "YTT",
    "Q",
    "COM",
    "ISC",
    # Docstrings
    "D",
    "FLY",
    # Typing & Annotations
    "ANN",
    "FA",
    "TC",
    # Correctness & Bugs
    "B",
    "A",
    "C4",
    "PIE",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "INT",
    "SLF",
    # Performance & Modernization
    "PERF",
    "FURB",
    "SLOT",
    # Safety, Exceptions & Quality
    "S",
    "BLE",
    "TRY",
    "EM",
    "RSE",
    "ASYNC",
    "DTZ",
    "T10",
    "PGH",
    "ERA",
    "EXE",
    "ICN",
    "LOG",
    "G",
    "FBT",
    # Pylint
    "PL",
    # Ruff Specific
    "RUF",
]
ignore = [
    "E501",
    "ISC001",
    "COM812",
    "ANN401",  # use Any in **kwargs
    "PLR0911", # many early returns in retry state machines
    "PLR0912", # many branches in retry state machines
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "S311",
    "D107",    # init docstrings are documented at class level
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D", "S101", "SLF001", "ANN001", "ANN201", "ANN202", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true

[tool.pyrefly]
project-includes = ["heartbeat_monitor"]
project-excludes = ["**/__pycache__/**", ".venv"]
python-version = "3.12"
preset = "all"

[tool.pyrefly.errors]
# Carried over from basedpyright: reportUnusedCallResult / reportExplicitAny = "none"
unused-call-result = false
explicit-any = false
