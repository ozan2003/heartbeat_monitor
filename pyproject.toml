[project]
name = "heartbeat-monitor"
version = "1.5.1"
description = "A simple client-server heartbeat monitoring tool for system analytics."
license.file = "LICENSE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.1.2",
    "pydantic>=2.12.3",
]

[dependency-groups]
dev = [
 "basedpyright>=1.39.0",
 "ruff>=0.2.2",
 "vermin>=1.7.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["heartbeat_monitor"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PIE",
    "SIM",
    "RET",
    "ARG",
    "EM",
    "PTH",
    "PL",
    "RUF",
    "S",
    "BLE",
    "ANN",
    "ASYNC",
    "PT",
    "D101",
    "D102",
    "D103",
]
ignore = [
    "E501",
    "ISC001",
    "COM812",
    "D203",
    "D213",
    "ANN401",  # use Any in **kwargs
    "PLR0913",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D101", "D102", "D103"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["heartbeat_monitor"]
exclude = ["**/__pycache__/**", ".venv"]
typeCheckingMode = "recommended"
reportUnusedCallResult = "none"
reportExplicitAny = "none"
reportAny = "none"